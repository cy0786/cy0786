body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}

button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;gap:12px 16px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.seal{width:28px;height:28px;margin:4px;flex:none;border:2px solid var(--seal);color:var(--seal);border-radius:3px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:14px;line-height:1;transform:rotate(45deg)}
.seal span{transform:rotate(-45deg)}
.brand h1{font-family:var(--f-display);font-size:19px;margin:0;letter-spacing:.04em;text-wrap:balance}
.brand small{display:block;color:var(--muted);font-size:12px;letter-spacing:.02em}
.search{flex:1 1 260px;min-width:0;position:relative}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:999px;background:var(--paper)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:6px 12px;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet);font-weight:500}
.btn.danger{color:var(--seal);border-color:var(--seal)}
.btn.small{padding:3px 9px;font-size:13px}
.btn.on{background:var(--seal-soft);border-color:var(--seal);color:var(--seal);font-weight:500}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.shell{max-width:1100px;margin:0 auto;padding-block:22px 120px;padding-inline:16px;display:flex;flex-direction:column;gap:22px}
.hero{display:grid;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--seal);font-weight:700;margin:0}
.lede{margin:0;font-size:17px;max-width:65ch}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.pos{all:unset;box-sizing:border-box;cursor:pointer;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-content:start;min-width:0}
.pos:hover{border-color:var(--accent)}
.pos:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pos[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.pos .code{grid-row:span 3;width:44px;height:44px;border-radius:8px;background:var(--accent);color:var(--sheet);display:grid;place-items:center;font-weight:700;font-size:14px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.pos .pname{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.06em;line-height:1.3}
.pos .plain{font-size:13px;color:var(--muted);line-height:1.5}
.pos .pcount{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pos.add{border-style:dashed;color:var(--muted);grid-template-columns:minmax(0,1fr);place-items:center}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;border-bottom:1px solid var(--line)}
.tab{all:unset;cursor:pointer;flex:none;padding:8px 14px;font-size:15px;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted)}
.tab:hover{color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--accent)}
.tab[aria-current="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.tab .n{font-size:12px;margin-left:4px;font-variant-numeric:tabular-nums}
.adminbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--seal-soft);color:var(--seal);border-radius:var(--r);padding:10px 14px;font-size:14px}
.adminbar strong{margin-right:auto}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:20px;max-width:440px}
.panel h2{font-family:var(--f-display);margin:0;font-size:22px}
.panel p{margin:0;color:var(--muted)}
.err{color:var(--seal)!important;font-size:14px}
.linkbtn.quiet{color:var(--muted);text-decoration:none;font-size:12px}
.pubswitch{background:var(--accent-soft);border-radius:8px;padding:8px 10px;color:var(--ink)!important;font-size:14px!important;font-weight:500}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:12px}

.list{display:flex;flex-direction:column;gap:10px}

.item.open{border-color:var(--accent)}

.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:start}

.item-body{padding:0 16px 16px;display:grid;gap:14px;min-width:0}
.sec-label{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:0 0 4px}
.timing{background:var(--accent-soft);border-radius:8px;padding:8px 12px;font-size:14px}

.refs{display:flex;flex-wrap:wrap;gap:8px}

.meta{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;display:flex;gap:16px;flex-wrap:wrap}
mark{background:var(--warn-bg);color:inherit;border-radius:3px;padding:0 1px}
.empty{background:var(--sheet);border:1px dashed var(--line);border-radius:var(--r);padding:24px;color:var(--muted);text-align:center}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.check{display:flex!important;grid-template-columns:none;align-items:center;gap:6px;flex-direction:row}
.confirm{background:var(--seal-soft);color:var(--seal);border-radius:8px;padding:8px 10px;font-size:14px}
.log{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:6px 16px}
.log div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.log div:last-child{border-bottom:0}

.savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sheet);border-top:2px solid var(--seal);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}

.savebar .msg{flex-basis:100%;font-size:13px;color:var(--seal)}
.savebar .msg:empty{display:none}
.toast{font-size:13px;color:var(--ok)}
@media (max-width:760px){
  .shell{gap:16px;padding-block:14px 140px}
  .menu{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .pos:last-child:nth-child(odd){grid-column:1/-1}
  .pos{grid-template-columns:minmax(0,1fr);padding:12px}
  .pos .code{grid-row:auto;width:36px;height:36px;font-size:13px}
  .pos .pname{font-size:16px}
  .lede{font-size:15px}
  .item-head{grid-template-columns:minmax(0,1fr)}
  .chips{justify-content:flex-start}
  .log div{grid-template-columns:minmax(0,1fr);gap:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

  function countPub(items) { return items.filter(function (i) { return i.published; }).length; }

    if (ui.edit) {
      var all = full.categories.reduce(function (a, c) { return a.concat(c.items); }, []);

        '<button type="button" class="btn small" data-act="log">變更紀錄（' + full.log.length + '）</button>' +
        '<button type="button" class="btn small" data-act="pw">變更密碼</button>' +
        '<button type="button" class="btn small" data-act="lock">登出</button></div>';
    } else if (full) {
      h += '<div class="banner">這是同仁會看到的畫面（只顯示已公開的流程）。</div>';
    }
    if (q) {
      var hits = [];

        c.items.forEach(function (it) {
          var hay = [c.name, it.title, it.summary, it.timing, it.owner].concat(it.steps, it.notes).join("\n").toLowerCase();

    } else if (ui.view === "log" && ui.edit) {
      h += '<div class="cat-head"><h2>變更紀錄</h2><p>只在後台顯示，同仁看不到。</p></div>';
      h += '<div class="log">' + (full.log.map(function (l) { return "<div><time>" + esc(l.date) + "</time><span>" + esc(l.text) + "</span></div>"; }).join("") || "<div><span>尚無紀錄</span></div>") + "</div>";

            '<label style="flex:1 1 80px">代號<input type="text" id="g-code-' + esc(g.id) + '" data-gfield="code" data-id="' + esc(g.id) + '" value="' + esc(g.code) + '" maxlength="4"></label></div>' +
            '<label>選單小字<input type="text" id="g-plain-' + esc(g.id) + '" data-gfield="plain" data-id="' + esc(g.id) + '" value="' + esc(g.plain) + '"><span class="hint">顯示在上方選單卡片上；留白則自動列出章節名稱</span></label>' +
            '<label>說明<input type="text" id="g-desc-' + esc(g.id) + '" data-gfield="desc" data-id="' + esc(g.id) + '" value="' + esc(g.desc) + '"></label></div>';
        } else {

          }).join("") + (ui.edit ? '<button type="button" class="tab" data-act="add-cat">＋ 新增章節</button>' : "") + "</div>";

              }).join("") + "</select></label>" +

  function onSubmit(e) {
    e.preventDefault();
    var p1 = document.getElementById("pw1").value, p2El = document.getElementById("pw2");

    if (e.target.id === "pw-form") {
      password = p1; ui.view = "cat"; markDirty(); ui.msg = "密碼已變更，請按「儲存檔案」讓新密碼生效。"; render(); return;
    }
    if (!vault) { enterBackOffice(setupData, p1); ui.dirty = true; ui.msg = "密碼已設定，請按「儲存檔案」，把加密後的檔案存回 H 槽。"; render(); return; }
    ui.busy = true; renderMain();
    decryptData(vault, p1).then(function (data) {
      ui.busy = false; enterBackOffice(data, p1); render();
    }, function () {
      ui.busy = false; ui.loginErr = "密碼不正確。"; renderMain();
    });
  }

  function itemHtml(it, c, showCat) {

    var h = '<article class="item' + (open ? " open" : "") + '">' +
      '<button type="button" class="item-head" data-act="toggle" data-id="' + esc(it.id) + '" aria-expanded="' + open + '">' +
      '<span class="item-title">' + hl(it.title || "（未命名流程）") + "</span>" +
      '<span class="chips">' + chips + "</span>" +
      (it.summary ? '<span class="item-sum">' + hl(it.summary) + "</span>" : "") + "</button>";

  function viewHtml(it) {
    var h = "";
    if (it.timing) h += '<div class="timing"><strong>時程：</strong>' + hl(it.timing) + "</div>";
    if (it.steps.length) h += '<div><p class="sec-label">作業步驟</p><ol class="steps">' + it.steps.map(function (s) { return "<li><span>" + hl(s) + "</span></li>"; }).join("") + "</ol></div>";
    if (it.notes.length) h += '<div><p class="sec-label">注意事項</p><ul class="notes">' + it.notes.map(function (s) { return "<li>" + hl(s) + "</li>"; }).join("") + "</ul></div>";
    var refs = it.refs.filter(function (r) { return safeUrl(r.url); });
    if (refs.length) h += '<div><p class="sec-label">相關連結</p><div class="refs">' + refs.map(function (r) { return '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.label || r.url) + "</a>"; }).join("") + "</div></div>";
    h += '<div class="meta">' + (it.owner ? "<span>負責：" + hl(it.owner) + "</span>" : "") + "<span>最後更新 " + esc(it.updated) + "</span></div>";
    return h;
  }

  function editHtml(it) {
    var id = esc(it.id);
    function f(label, field, val, area, hint) {
      var fid = "f-" + id + "-" + field;
      return "<label>" + label + (area
        ? '<textarea id="' + fid + '" data-field="' + field + '" data-id="' + id + '">' + esc(val) + "</textarea>"
        : '<input type="text" id="' + fid + '" data-field="' + field + '" data-id="' + id + '" value="' + esc(val) + '">') +
        (hint ? '<span class="hint">' + hint + "</span>" : "") + "</label>";
    }
    return '<div class="form">' +
      '<label class="check pubswitch"><input type="checkbox" id="f-' + id + '-published" data-field="published" data-id="' + id + '"' + (it.published ? " checked" : "") + '> 公開給同仁看</label>' +
      f("流程名稱", "title", it.title) + f("摘要", "summary", it.summary) + f("時程／期限", "timing", it.timing) + f("負責人／單位", "owner", it.owner) +
      f("作業步驟", "steps", it.steps.join("\n"), true, "一行一個步驟，順序即步驟順序") +
      f("注意事項", "notes", it.notes.join("\n"), true, "一行一點") +
      f("相關連結", "refs", it.refs.map(function (r) { return (r.label ? r.label + " | " : "") + r.url; }).join("\n"), true, "一行一個，格式：名稱 | https://網址") +
      '<div class="row end"><button type="button" class="btn small" data-act="up" data-id="' + id + '">上移</button><button type="button" class="btn small" data-act="down" data-id="' + id + '">下移</button>' +
      (ui.confirm === "item:" + it.id
        ? '<span class="confirm">確定刪除這個流程？</span><button type="button" class="btn small danger" data-act="del" data-id="' + id + '">確定刪除</button><button type="button" class="btn small" data-act="cancel">取消</button>'
        : '<button type="button" class="btn small danger" data-act="ask" data-key="item:' + id + '">刪除流程</button>') +
      "</div></div>";

  function renderSavebar() {
    var bar = document.getElementById("savebar");
    bar.hidden = !(full && (ui.dirty || ui.msg));
    if (bar.hidden) return;
    var hadFocus = document.activeElement && document.activeElement.id === "save-note";
    bar.innerHTML = '<div class="in">' +
      (ui.dirty ? '<strong>有未儲存的修改</strong><input id="save-note" type="text" placeholder="修改說明（例如：更新股東會通知期限）" value="' + esc(ui.note) + '">' +
        '<button type="button" class="btn" data-act="discard"' + (ui.saving ? " disabled" : "") + '>捨棄修改</button>' +
        '<button type="button" class="btn primary" data-act="save"' + (ui.saving ? " disabled" : "") + ">" + (ui.saving ? "儲存中…" : "儲存檔案") + "</button>" : "") +
      '<span class="msg">' + esc(ui.msg) + "</span></div>";
    if (hadFocus) { var n = document.getElementById("save-note"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
  }

  function markDirty() { var was = ui.dirty; ui.dirty = true; ui.msg = ""; if (!was) renderSavebar(); }

  function onInput(e) {
    var t = e.target;
    if (t.id === "save-note") { ui.note = t.value; return; }
    if (!ui.edit) return;
    if (t.dataset.gfield) {
      var g = findGroup(t.dataset.id); if (!g || g[t.dataset.gfield] === t.value) return;
      g[t.dataset.gfield] = t.value; markDirty(); renderMenu();
      return;
    }
    if (t.dataset.cfield) {
      var c = findCat(t.dataset.id); if (!c || c[t.dataset.cfield] === t.value) return;
      c[t.dataset.cfield] = t.value; markDirty();
      if (t.dataset.cfield === "group") { ui.cat = c.id; ui.group = c.group; render(); }
      else if (t.dataset.cfield === "name") renderMenu();
      return;
    }
    if (!t.dataset.field) return;
    var f = findItem(t.dataset.id); if (!f) return;
    var it = f.item, k = t.dataset.field;
    if (k === "published") {
      if (it.published === t.checked) return;
      it.published = t.checked; markDirty(); renderMain(); renderMenu(); return;
    }
    var before = JSON.stringify(it[k]);
    if (k === "steps" || k === "notes") it[k] = t.value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
    else if (k === "refs") it.refs = t.value.split("\n").map(function (l) {
      l = l.trim(); if (!l) return null;
      var p = l.split("|"); if (p.length > 1) return { label: p[0].trim(), url: p.slice(1).join("|").trim() };
      return { label: "", url: l };
    }).filter(Boolean);
    else it[k] = t.value;
    if (JSON.stringify(it[k]) === before) return;
    it.updated = today();
    markDirty();
  }

  function move(arr, i, d) { var j = i + d; if (j < 0 || j >= arr.length) return false; var x = arr[i]; arr[i] = arr[j]; arr[j] = x; return true; }

  function onClick(e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var act = b.dataset.act, id = b.dataset.id, f, c, i;
    var editOnly = ["add-cat", "cat-up", "cat-down", "cat-del", "add-item", "up", "down", "del", "ask", "pub-all", "unpub-all", "log", "pw", "lock"];
    if (editOnly.indexOf(act) >= 0 && !ui.edit) return;
    switch (act) {
      case "group":
        c = catsIn(id)[0];
        ui.view = "cat"; ui.group = id; ui.cat = c ? c.id : null; ui.q = ""; document.getElementById("q").value = "";
        break;
      case "cat":
        ui.view = "cat"; ui.cat = id; ui.group = groupOf(findCat(id)).id; ui.q = ""; document.getElementById("q").value = "";
        break;
      case "login": ui.view = "login"; ui.loginErr = ""; ui.q = ""; document.getElementById("q").value = ""; break;
      case "cancel-login": ui.view = "cat"; ui.loginErr = ""; break;
      case "pw": ui.view = "pw"; ui.loginErr = ""; break;
      case "lock":
        if (ui.dirty) { ui.msg = "還有未儲存的修改，請先儲存檔案或捨棄修改。"; renderSavebar(); return; }
        full = null; saved = null; password = null; ui.edit = false; ui.msg = ""; ui.view = "cat";
        break;
      case "log": ui.view = "log"; ui.q = ""; document.getElementById("q").value = ""; break;
      case "toggle": {
        var isOpen = !!ui.open[id] || (ui.q.trim() && ui.open[id] !== false);
        ui.open[id] = !isOpen; ui.confirm = null;
        renderMain(); return;
      }
      case "pub-all": case "unpub-all":
        c = findCat(id); c.items.forEach(function (x) { x.published = act === "pub-all"; }); markDirty(); break;
      case "add-cat":
        c = { id: uid(), name: "新章節", desc: "", group: ui.group, items: [] };
        full.categories.push(c); ui.cat = c.id; ui.view = "cat"; markDirty(); break;
      case "cat-up": case "cat-down":
        i = full.categories.indexOf(findCat(id));
        if (move(full.categories, i, act === "cat-up" ? -1 : 1)) markDirty(); break;
      case "cat-del":
        full.categories = full.categories.filter(function (x) { return x.id !== id; });
        ui.cat = null; ui.confirm = null; markDirty(); break;
      case "add-item":
        c = findCat(id);
        var it = { id: uid(), title: "", summary: "", timing: "", owner: "", steps: [], notes: [], refs: [], updated: today(), published: false };
        c.items.push(it); ui.open[it.id] = true; markDirty();
        render();
        var t = document.getElementById("f-" + it.id + "-title"); if (t) t.focus();
        return;
      case "up": case "down":
        f = findItem(id); if (f && move(f.cat.items, f.idx, act === "up" ? -1 : 1)) markDirty(); break;
      case "del":
        f = findItem(id); if (f) { f.cat.items.splice(f.idx, 1); markDirty(); } ui.confirm = null; break;
      case "ask": ui.confirm = b.dataset.key; break;
      case "cancel": ui.confirm = null; break;
      case "discard":
        if (!vault) { ui.msg = "第一次設定密碼後，必須先儲存檔案。"; renderSavebar(); return; }
        full = clone(saved); ui.dirty = false; ui.note = ""; ui.msg = ""; ui.confirm = null;
        break;
      case "save": save(); return;
      default: return;
    }
    render();
  }

  // ---------- saving ----------
  var RESET = ":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
  var SC = "<" + "/script>";
  var FILE_NAME = "法務守備位置.html";
  function jsonBlock(id, obj) { return '<script type="application/json" id="' + id + '">\n' + JSON.stringify(obj, null, 1).replace(/</g, "\\u003c") + "\n" + SC + "\n"; }

  function buildDocument(data, v) {
    var fonts = Array.prototype.map.call(document.querySelectorAll('link[href*="fonts.googleapis"],link[rel="preconnect"]'), function (l) { return l.outerHTML; }).join("\n");
    return "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>" + RESET + "</style></head><body>" +
      "<title>法務守備位置</title>\n" + fonts + "\n" +
      document.getElementById("app-style").outerHTML + "\n" +
      '<div id="app"></div>\n' +
      jsonBlock("public-data", publicOf(data)) + jsonBlock("vault", v) +
      '<script id="app-script">' + document.getElementById("app-script").textContent + SC +
      "</body></html>";
  }

  function writeFile(text) {
    if (window.claude && window.claude.use) {
      return window.claude.use("downloads").then(function (dl) {
        if (!dl) throw { code: "unavailable" };
        return dl.save({ filename: FILE_NAME, data: text }).then(function () { return "download"; });
      });
    }
    if (window.showSaveFilePicker) {
      return window.showSaveFilePicker({ suggestedName: FILE_NAME, types: [{ description: "網頁檔", accept: { "text/html": [".html"] } }] }).then(function (h) {
        return h.createWritable().then(function (w) { return w.write(text).then(function () { return w.close(); }); }).then(function () { return "picked"; });
      }, function (err) { if (err && err.name === "AbortError") throw { code: "declined" }; return blobDownload(text); });
    }
    return Promise.resolve(blobDownload(text));
  }
  function blobDownload(text) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "text/html;charset=utf-8" }));
    a.download = "legal-positions.html";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
    return "download";
  }

  function save() {
    if (!full || !password) return;
    var next = clone(full);
    next.meta.updated = today();
    next.log.unshift({ date: today(), text: ui.note.trim() || "更新內容" });
    ui.saving = true; ui.msg = ""; renderSavebar();
    encryptData(next, password).then(function (v) {
      return writeFile(buildDocument(next, v)).then(function (how) {
        vault = v; pubData = publicOf(next); full = next; saved = clone(next); ui.dirty = false; ui.note = ""; ui.saving = false;
        ui.msg = how === "picked" ? "已儲存。若存的是 H 槽上的原檔，同仁重新開啟就會看到新內容。" : "已下載新檔案，請把它放到 H 槽，取代原本的「" + FILE_NAME + "」。";
        render();
      });
    }).catch(function (err) {
      ui.saving = false;
      ui.msg = err && err.code === "declined" ? "已取消儲存，修改還在，可以再按一次「儲存檔案」。" : "儲存失敗，請換用 Edge 或 Chrome 再試。";
      renderSavebar();
    });
  }

  window.addEventListener("beforeunload", function (e) { if (ui.dirty) { e.preventDefault(); e.returnValue = ""; } });
  shell(); render();
})();
</script>
